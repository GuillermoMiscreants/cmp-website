name: Deploy production

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: 66h6oo6f
          PUBLIC_SANITY_DATASET: production
          PUBLIC_SANITY_STUDIO_URL: https://www.sanity.io/@oRFUjdx6o/studio/l1bgj0ve324zdjj05msyfqkz
      - run: npx wrangler deploy -c wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7deaa344385bde00d90a209fb1e1d4bf
